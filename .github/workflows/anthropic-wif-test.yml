import anthropic
from anthropic import WorkloadIdentityCredentials

def read_token() -> str:
    with open("/path/to/token") as f:
        return f.read().strip()

client = anthropic.Anthropic(
    credentials=WorkloadIdentityCredentials(
        identity_token_provider=read_token,
        federation_rule_id="fdrl_01GBgBN1XUGbvm4FVNWt47HA",
        organization_id="a03d7eae-c0c7-4ad3-8fb2-34512da3f928",
        service_account_id="svac_01RPsuuHLEWKz3yHQ1zH5UDF",
        workspace_id="wrkspc_01Q3nAfEzfJnGdkTdLhBv4eD",
    ),
)

message = client.messages.create(
    model="claude-sonnet-5-5",
    max_tokens=1024,
    messages=[{"role": "user", "content": "Hello, Claude"}],
)
print(next(block.text for block in message.content if block.type == "text"))
